name: Supabase keep-alive

# Supabase pauses free projects after 7 days without traffic.
# This pings both projects every 3 days so they stay up. Run it by hand from the Actions tab too.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: khatet Project
            url: SUPABASE_URL
            key: SUPABASE_PUBLISHABLE_KEY
          - project: khatet prod
            url: SUPABASE_PROD_URL
            key: SUPABASE_PROD_PUBLISHABLE_KEY
    env:
      SUPABASE_URL: ${{ secrets[matrix.url] }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets[matrix.key] }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add ${{ matrix.url }} and ${{ matrix.key }} under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Auth health only answers 200 with a valid key, so this also checks the key.
      - name: Ping Auth
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "${SUPABASE_URL%/}/auth/v1/health")
          echo "Auth answered $status"
          [ "$status" = "200" ]

      # A real database query through the REST API. Tables are closed to the public key,
      # so a 401 "permission denied" is expected and still means Postgres ran the query.
      # Only a server error (5xx, or 540 for a paused project) fails the run.
      - name: Query the database
        run: |
          status=$(curl -sS -o body.txt -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "${SUPABASE_URL%/}/rest/v1/projects?select=id&limit=1")
          echo "REST answered $status: $(head -c 300 body.txt)"
          [ "$status" -lt 500 ]
