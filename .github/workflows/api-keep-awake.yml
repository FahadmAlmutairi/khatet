name: API keep-awake

# The API runs on Render's free plan, which sleeps after 15 minutes without traffic.
# The first visit after that waits up to a minute on "Opening Khatet..." and the sign-in
# code check waits the same. This pings the health endpoint every 10 minutes as a backup
# to an uptime monitor (UptimeRobot). GitHub can start scheduled runs late, so it cannot
# promise the server never sleeps on its own.
#
# The API URL comes from the repository variable API_URL (Settings > Secrets and variables >
# Actions > Variables), defaulting to the deployed URL in the README.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-keep-awake
  cancel-in-progress: true

jobs:
  ping:
    name: Ping the API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL || 'https://khatet.onrender.com' }}
    steps:
      # A sleeping server can take about a minute to answer, so allow up to two.
      - name: Ping /api/health
        run: |
          status=$(curl -sS -o body.txt -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 15 \
            "${API_URL%/}/api/health")
          echo "API answered $status: $(head -c 200 body.txt)"
          [ "$status" = "200" ]
